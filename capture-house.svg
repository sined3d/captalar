<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#173f63"/><stop offset="1" stop-color="#071d34"/></linearGradient>
  <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#dfe8ee"/><stop offset="1" stop-color="#8298a9"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#83b3d0" stop-opacity=".85"/><stop offset="1" stop-color="#142d42" stop-opacity=".95"/></linearGradient>
  <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe1a5"/><stop offset="1" stop-color="#b36b31"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<rect width="900" height="520" fill="url(#sky)"/>
<circle cx="730" cy="120" r="90" fill="#b8d9ec" opacity=".12" filter="url(#glow)"/>
<rect y="405" width="900" height="115" fill="#081b2d"/>
<!-- house -->
<path d="M315 188 L560 92 L790 182 L790 430 L315 430 Z" fill="#102a42"/>
<path d="M290 202 L560 96 L810 192 L795 218 L560 140 L315 236 Z" fill="#263f55"/>
<path d="M360 220 L560 158 L748 224 L748 395 L360 395 Z" fill="url(#wall)"/>
<!-- upper glass -->
<rect x="405" y="205" width="310" height="93" fill="url(#glass)"/>
<path d="M405 250 H715 M500 205 V298 M610 205 V298" stroke="#d8edf9" stroke-opacity=".45" stroke-width="4"/>
<!-- lower glass -->
<rect x="390" y="304" width="335" height="91" fill="url(#glass)"/>
<path d="M390 349 H725 M470 304 V395 M590 304 V395" stroke="#d8edf9" stroke-opacity=".4" stroke-width="4"/>
<!-- warm interior -->
<rect x="510" y="318" width="65" height="77" fill="url(#warm)" opacity=".75"/>
<rect x="620" y="318" width="58" height="77" fill="url(#warm)" opacity=".55"/>
<!-- terrace -->
<rect x="330" y="291" width="430" height="13" fill="#19354d"/>
<rect x="340" y="304" width="410" height="7" fill="#b9ccd8" opacity=".45"/>
<!-- pool / foreground -->
<path d="M250 432 Q520 392 860 438 L900 520 L190 520 Z" fill="#2f6f91" opacity=".7"/>
<path d="M250 455 Q560 420 870 463" stroke="#bce4f5" stroke-opacity=".55" stroke-width="5" fill="none"/>
<!-- trees -->
<g fill="#0b3b2e"><circle cx="120" cy="260" r="90"/><circle cx="170" cy="220" r="70"/><circle cx="830" cy="270" r="105"/><circle cx="770" cy="220" r="75"/></g>
<g fill="#174d3a" opacity=".9"><circle cx="70" cy="320" r="70"/><circle cx="865" cy="345" r="80"/></g>
<!-- lights -->
<g fill="#ffe8ad"><circle cx="430" cy="330" r="4"/><circle cx="540" cy="330" r="4"/><circle cx="650" cy="330" r="4"/></g>
</svg>
